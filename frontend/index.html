<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glacier Explorer</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    aside {
      width: 310px;
      flex-shrink: 0;
      padding: 24px;
      overflow-y: auto;
      background: white;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
    }

    select,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    #area {
      font-size: 28px;
      font-weight: bold;
    }

    #status {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .error {
      color: #b42318;
    }

    #warning {
      padding: 12px;
      background: #fff4ce;
      border-left: 4px solid #b58100;
      line-height: 1.5;
    }

    .note {
      font-size: 13px;
      line-height: 1.5;
      color: #555;
    }

    @media (max-width: 650px) {
      body {
        flex-direction: column;
      }

      aside {
        width: 100%;
        max-height: 50vh;
      }

      #map {
        min-height: 50vh;
      }
    }
  </style>
</head>

<body>
  <aside>
    <h1>Glacier Explorer</h1>

    <label for="glacier">Select glacier</label>
    <select id="glacier">
      <option value="rob-roy">Rob Roy — New Zealand</option>
      <option value="marmolada">Marmolada — Italy</option>
    </select>

    <label for="year">Select year</label>
    <select id="year"></select>

    <button id="view" type="button">View Year</button>

    <p id="status" role="status" aria-live="polite">
      Select a year and click View Year.
    </p>

    <hr>

    <h3>Detected glacier-like area</h3>
    <p id="area">—</p>

    <p>
      Reference year:
      <strong id="reference">—</strong>
    </p>

    <p>
      Similarity threshold:
      <span id="threshold">—</span>
    </p>

    <p id="warning" hidden></p>

    <p class="note">
      The cyan overlay shows pixels matching the reference.
      The satellite basemap does not change with the selected year.
      Results are not measurements of ice-volume loss.
    </p>
  </aside>

  <div id="map" aria-label="Glacier map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API = "http://127.0.0.1:5000";

    // Leaflet coordinates: latitude, longitude.
    const glaciers = {
      "rob-roy": {
        name: "Rob Roy",
        centre: [-44.455, 168.741],
        zoom: 13
      },
      "marmolada": {
        name: "Marmolada",
        centre: [46.43522, 11.857975],
        zoom: 13
      }
    };

    const glacierSelect = document.getElementById("glacier");
    const yearSelect = document.getElementById("year");
    const viewButton = document.getElementById("view");
    const status = document.getElementById("status");
    const area = document.getElementById("area");
    const reference = document.getElementById("reference");
    const threshold = document.getElementById("threshold");
    const warning = document.getElementById("warning");

    for (let year = 2017; year <= 2024; year++) {
      yearSelect.add(new Option(year, year));
    }

    yearSelect.value = "2019";

    const map = L.map("map").setView(
      glaciers["rob-roy"].centre,
      glaciers["rob-roy"].zoom
    );

    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/" +
      "World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Tiles &copy; Esri",
        maxZoom: 19
      }
    ).addTo(map);

    const streets = L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }
    );

    L.control.layers({
      Satellite: satellite,
      Streets: streets
    }).addTo(map);

    let overlay = null;

    function clearResult() {
      if (overlay) {
        map.removeLayer(overlay);
        overlay = null;
      }

      area.textContent = "—";
      reference.textContent = "—";
      threshold.textContent = "—";
      warning.hidden = true;
      warning.textContent = "";
      status.className = "";
    }

    function showDemoWarning() {
      if (glacierSelect.value === "marmolada") {
        warning.textContent =
          "Demo only: Marmolada currently uses an artificial, " +
          "unverified reference polygon. Results require Applied " +
          "Science review and are not validated glacier measurements.";

        warning.hidden = false;
      }
    }

    function setBusy(busy) {
      viewButton.disabled = busy;
      glacierSelect.disabled = busy;
      yearSelect.disabled = busy;
      viewButton.textContent = busy ? "Analysing…" : "View Year";
    }

    async function loadGlacier() {
      const glacierId = glacierSelect.value;
      const year = yearSelect.value;
      const selected = glaciers[glacierId];

      clearResult();
      showDemoWarning();
      setBusy(true);

      map.setView(selected.centre, selected.zoom);
      status.textContent =
        `Analysing ${selected.name} for ${year}…`;

      try {
        const response = await fetch(
          `${API}/api/glacier/${year}?glacier=${glacierId}`
        );

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(
            data.error || `Request failed: ${response.status}`
          );
        }

        // Detect an old backend that ignores glacier selection.
        if (data.glacierId !== glacierId) {
          throw new Error(
            "The backend returned the wrong glacier or is running " +
            "the old app.py. Restart the updated backend."
          );
        }

        if (
          !Number.isFinite(data.area) ||
          data.area < 0 ||
          typeof data.tileUrl !== "string"
        ) {
          throw new Error(
            "The backend returned incomplete analysis data."
          );
        }

        area.textContent = `${data.area.toFixed(2)} km\u00B2`;
        reference.textContent = data.referenceYear;
        threshold.textContent = Number(data.threshold).toFixed(2);

        if (data.warning) {
          warning.textContent = data.warning;
          warning.hidden = false;
        }

        const newOverlay = L.tileLayer(data.tileUrl, {
          opacity: 0.75,
          maxZoom: 19
        });

        overlay = newOverlay;
        let tileFailed = false;

        newOverlay.on("tileerror", () => {
          if (overlay !== newOverlay) return;

          tileFailed = true;
          status.className = "error";
          status.textContent =
            "Analysis returned data, but some overlay tiles failed " +
            "to load. Click View Year to retry.";
        });

        newOverlay.on("load", () => {
          if (overlay !== newOverlay || tileFailed) return;

          status.textContent =
            `${selected.name}, ${year}: ` +
            (data.area === 0
              ? "No matching pixels detected."
              : "Analysis and overlay loaded.");
        });

        status.textContent =
          `${selected.name}, ${year}: analysis returned. ` +
          "Loading overlay…";

        newOverlay.addTo(map);

      } catch (error) {
        console.error(error);
        status.className = "error";
        status.textContent =
          `Could not load glacier data: ${error.message}`;

      } finally {
        setBusy(false);
      }
    }

    viewButton.addEventListener("click", loadGlacier);

    // Changing glacier automatically runs the selected year.
    glacierSelect.addEventListener("change", loadGlacier);

    yearSelect.addEventListener("change", () => {
      clearResult();
      showDemoWarning();
      status.textContent =
        "Click View Year to analyse the selected year.";
    });
  </script>
</body>
</html>
